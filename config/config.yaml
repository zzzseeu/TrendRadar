# ═══════════════════════════════════════════════════════════════
#                    TrendRadar 配置文件
#                      Version: 2.4.0
# ═══════════════════════════════════════════════════════════════


# 可视化配置编辑器地址: https://sansan0.github.io/TrendRadar/


# ===============================================================
# 1. 基础设置
# ===============================================================
app:
  # 时区配置（影响所有时间显示、调度系统判断、数据存储）
  # 常用时区：
  #   - Asia/Shanghai (北京时间 UTC+8)
  #   - America/New_York (美东时间 UTC-5/-4)
  #   - Europe/London (伦敦时间 UTC+0/+1)
  # 完整时区列表: https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
  timezone: "Asia/Shanghai"
  show_version_update: true           # 是否显示版本更新提示（true=显示, false=隐藏）


# ===============================================================
# 1.5 调度系统 —— 什么时间做什么事
#
# 通过 timeline.yaml 里定义的时间段来自动决定：
#   - 什么时候推送通知
#   - 什么时候做 AI 分析
#   - 用什么报告模式
#
# 快速上手：选一个预设模板，改 preset 的值就行
#
#   always_on       → 全天候，有新增即推送
#   morning_evening → 全天推送 + 晚间当日汇总（推荐）
#   office_hours    → 工作日三段式（到岗→午间→收工），周末增量自由推
#   night_owl       → 午后速览 + 深夜全天汇总
#   custom          → 完全自定义，详见 timeline.yaml
#
# 详细时间线图请查看 config/timeline.yaml
# ===============================================================
schedule:
  enabled: true                         # 是否启用调度系统（true=启用, false=关闭，默认关闭）
  preset: "custom"                      # 预设模板名称（见上方说明）


# ===============================================================
# 2. 数据源 - 热榜平台
#
# 数据来源于 newsnow 开源项目: https://github.com/ourongxing/newsnow
# 你可以自行部署 newsnow 并将 api_url 指向你自己的实例
#
# enabled: 是否启用热榜抓取（总开关）
# api_url: 热榜数据 API 地址（可选，留空使用默认地址）
# sources: 平台列表
#   - id: 平台唯一标识（勿修改）
#   - name: 显示名称（可自定义，修改后不影响运行）
#   - expected_domain: 域名安全校验（可选，建议配置）
#     填写主域名（如 baidu.com），自动匹配该域名及其所有子域名
#     校验返回数据中的链接是否为 HTTPS 且域名匹配，不匹配时丢弃该平台数据并记录警告
#     可有效防范链接劫持或数据篡改
#     只要 api_url 不是你自己部署的实例，都推荐配置 expected_domain
# ===============================================================
platforms:
  enabled: false                        # 当前只监控已配置的育种网站，不抓取大众热榜
  api_url: ""                            # 热榜数据 API 地址（留空使用默认地址）
                                        # 如果你自行部署了 newsnow，填入你的地址，如: https://your-domain.com/api/s
  sources:
    - id: "toutiao"
      name: "今日头条"
      expected_domain: "toutiao.com"
    - id: "baidu"
      name: "百度热搜"
      expected_domain: "baidu.com"
    - id: "wallstreetcn-hot"
      name: "华尔街见闻"
      expected_domain: "wallstreetcn.com"
    - id: "thepaper"
      name: "澎湃新闻"
      expected_domain: "thepaper.cn"
    - id: "bilibili-hot-search"
      name: "bilibili 热搜"
      expected_domain: "bilibili.com"
    - id: "cls-hot"
      name: "财联社热门"
      expected_domain: "cls.cn"
    - id: "ifeng"
      name: "凤凰网"
      expected_domain: "ifeng.com"
    - id: "tieba"
      name: "贴吧"
      expected_domain: "baidu.com"
    - id: "weibo"
      name: "微博"
      expected_domain: "weibo.com"
    - id: "douyin"
      name: "抖音"
      expected_domain: "douyin.com"
    - id: "zhihu"
      name: "知乎"
      expected_domain: "zhihu.com"



# ===============================================================
# 3. 数据源 - RSS 订阅
#
# 与热榜数据分开存储，按时间流展示
# 每个源配置：id(唯一标识)、name(显示名称)、url(订阅地址)
# enabled: 可选，默认 true
# source_type: 可选，rss（默认）| irri_news | web_news | corteva_news
# fetch_url: 可选，仅用于抓取；通知中的文章链接仍使用官网地址
# ===============================================================
rss:
  enabled: true                       # 是否启用 RSS 抓取（true=启用, false=关闭）

  news_search:
    enabled: true
    max_results_per_provider: 50
    max_hotspots: 5
    similarity_threshold: 0.86
    providers:
      # GDELT 当前对本出口持续返回 HTTP 429；暂时停用，避免阻断每日严格交付。
      gdelt: false
      google_news: true
    authority_domains:
      - reuters.com
      - nature.com
      - science.org
      - caas.cn
      - moa.gov.cn
      - cgiar.org
      - irri.org
      - hainan.gov.cn
      - sanya.gov.cn
    topics:
      - id: gene-editing
        zh: "作物 基因编辑 分子育种"
        en: "crop gene editing molecular breeding"
      - id: genomic-breeding
        zh: "作物 基因组选择 全基因组关联 育种"
        en: "crop genomic selection genome-wide association breeding"
      - id: germplasm-traits
        zh: "作物 种质资源 抗病 抗逆 产量 品质 改良"
        en: "crop germplasm disease resistance stress tolerance yield quality breeding"
      - id: seed-policy
        zh: "作物 品种审定 品种登记 植物新品种权 种子法 种业法规"
        en: "crop variety approval registration plant variety protection seed law regulation"
      - id: breeding-policy-support
        zh: "种业振兴 种质资源 育种项目 财政补贴 农业科研支持"
        en: "seed industry revitalization germplasm breeding projects fiscal subsidies agricultural research support"
      - id: breeding-policy-implementation
        zh: "种业政策 会议部署 领导调研 行业倡议 企业响应"
        en: "seed policy implementation meeting deployment leadership inspection industry initiative enterprise response"
      - id: nanfan-breeding
        zh: "南繁 水稻 育种 制种 种业"
        en: "Hainan Nanfan rice breeding seed industry"

  feeds:
    - id: "hacker-news"
      name: "Hacker News"
      url: "https://hnrss.org/frontpage"
      enabled: false                  # 当前仅监控育种相关来源
      max_items: 30

    - id: "ruanyifeng"
      name: "阮一峰的网络日志"
      url: "http://www.ruanyifeng.com/blog/atom.xml"
      enabled: false                  # 禁用
